[build-system]
requires = ["setuptools>=77"]  # 77: license als SPDX-Ausdruck, license-files
build-backend = "setuptools.build_meta"

[project]
name = "laptimer-client"
dynamic = ["version"]  # aus laptimer_client.__version__ (unten)
description = "Python-Client für die API des FPV-Laptimers (/api/v1)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "bli-blu-bla" }]
keywords = ["fpv", "drone", "racing", "laptimer", "lap timer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = []  # HTTP-Befehle brauchen nur die Standardbibliothek

[project.optional-dependencies]
events = ["websockets>=13"]  # Events über den WebSocket

[project.urls]
Homepage = "https://github.com/bli-blu-bla/fpv-laptimer"
Documentation = "https://bli-blu-bla.github.io/fpv-laptimer/api/clients/"
Source = "https://github.com/bli-blu-bla/fpv-laptimer/tree/main/clients/python"
Issues = "https://github.com/bli-blu-bla/fpv-laptimer/issues"

[tool.setuptools]
packages = ["laptimer_client"]

[tool.setuptools.package-data]
laptimer_client = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "laptimer_client.__version__" }
