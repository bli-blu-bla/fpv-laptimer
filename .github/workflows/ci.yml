# Tests on every push: server (cargo test), web page (JSDoc types, build),
# the install script's syntax, the Python and JS clients' packages
# (publishing: pypi.yml, npm.yml). The release (firmware, packages, signature) is release.yml.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe (version)

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ci-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ci-cargo-

      - name: Server
        working-directory: server
        run: cargo test --release

      - name: Web page
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      - name: Python client (package)
        working-directory: clients/python
        run: |
          pipx run build
          pipx run twine check --strict dist/*

      - name: JS client (types, package)
        working-directory: clients/js
        run: |
          npm run check
          npm pack --dry-run

      - name: Scripts
        run: bash -n deploy/install.sh tools/build_release.sh && sh -n deploy/update-check.sh
