# Tests on every push: server (cargo test), web page (JSDoc types, build),
# the install script's syntax. The release (firmware, packages, signature)
# is release.yml.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe (version)

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ci-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ci-cargo-

      - name: Server
        working-directory: server
        run: cargo test --release

      - name: Web page
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      - name: Scripts
        run: bash -n deploy/install.sh tools/build_release.sh && sh -n deploy/update-check.sh
