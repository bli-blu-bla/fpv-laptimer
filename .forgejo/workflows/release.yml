# A release for the Raspberry Pi, on a tag "v*" (git tag v0.2.0 && git push --tags):
# tests, firmware, web page, server for aarch64 (tools/build_release.sh), signed
# with minisign, uploaded to the repository's releases.
#
# Secrets (repository → Settings → Actions → Secrets):
#   RELEASE_SIGNING_KEY       the whole content of minisign.key (made with `minisign -G`)
#   RELEASE_SIGNING_PASSWORD  its password
# The public key is minisign.pub in the repository; the server checks
# updates against it.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe: the firmware's version

      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv python3-pip cmake ninja-build minisign jq
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --quiet platformio cargo-zigbuild ziglang
          echo /opt/venv/bin >> "$GITHUB_PATH"
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --target aarch64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory '*'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: release-${{ hashFiles('firmware/platformio.ini', 'server/Cargo.lock') }}
          restore-keys: release-

      - name: Tests
        run: |
          (cd server && cargo test --release)
          (cd frontend && npm ci --no-audit --no-fund && npm run check)

      - name: Build
        run: tools/build_release.sh "${GITHUB_REF_NAME#v}"

      - name: Sign
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: |
          version=${GITHUB_REF_NAME#v}
          key=$(mktemp)
          printf '%s\n' "$KEY" > "$key"
          tarball=dist/laptimer-$version-aarch64.tar.gz
          # minisign reads the password from stdin when there is no terminal.
          printf '%s\n' "$PASSWORD" | minisign -S -s "$key" -m "$tarball" -t "laptimer $version aarch64"
          rm -f "$key"
          minisign -V -p minisign.pub -m "$tarball"

      - name: Upload
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#v}
          api="$SERVER/api/v1/repos/$REPO/releases"
          auth="Authorization: token $TOKEN"
          # A version with "-" (0.2.0-rc1) is a pre-release.
          pre=false
          case $version in *-*) pre=true ;; esac
          body=$(jq -n --arg tag "$GITHUB_REF_NAME" --arg name "Laptimer $version" --argjson pre $pre \
            '{tag_name: $tag, name: $name, prerelease: $pre,
              body: "Für den Raspberry Pi (64-bit Pi OS). Installation: tar xzf laptimer-*.tar.gz && cd laptimer-*/ && ./install.sh"}')
          id=$(curl -sSf -X POST -H "$auth" -H 'content-type: application/json' -d "$body" "$api" | jq -r .id)
          for f in dist/laptimer-$version-aarch64.tar.gz*; do
            echo "upload $f"
            curl -sSf -X POST -H "$auth" -F "attachment=@$f" "$api/$id/assets?name=$(basename "$f")" > /dev/null
          done
