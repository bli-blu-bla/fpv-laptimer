[package]
name = "laptimer"
version = "0.1.0"
edition = "2024"
description = "FPV lap timer: reads ESP32-C5 boards running the widscan58 firmware"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
ctrlc = "3"
# Without libudev: cross-compiling for the Pi needs no C library.
serialport = { version = "4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled: SQLite is compiled in, nothing to install on the Pi.
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "io-util"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
# Writes the firmware from the web page (Boards → Firmware); without the CLI.
espflash = { version = "4.6", default-features = false, features = ["serialport"] }
sha2 = "0.10"
# Backups of the database (gzip).
flate2 = "1"
# ~/.laptimer/config.toml
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
serde_ignored = "0.1"
tar = { version = "0.4", default-features = false }
# Checks the signature of an update (minisign, pure Rust).
minisign-verify = "0.3.0"
# The connection to a server of the user's (remote.rs): a WebSocket client,
# wss:// with rustls and ring (no OpenSSL: the cross-build stays C-free).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
