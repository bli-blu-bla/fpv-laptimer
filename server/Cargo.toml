[package]
name = "laptimer"
version = "0.1.0"
edition = "2024"
description = "FPV lap timer: reads ESP32-C5 boards running the widscan58 firmware"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
ctrlc = "3"
# Without libudev: cross-compiling for the Pi needs no C library.
serialport = { version = "4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled: SQLite is compiled in, nothing to install on the Pi.
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
# Writes the firmware from the web page (Boards → Firmware); without the CLI.
espflash = { version = "4.6", default-features = false, features = ["serialport"] }
